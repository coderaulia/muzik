name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: "Build (${{ matrix.arch }})"
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install packaging tools (rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'corretto'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Package Release Distributables
        run: |
          ./gradlew packageReleaseDeb packageReleaseRpm packagePortableDistributable

      - name: Stage Release Artifacts
        run: |
          mkdir -p artifacts
          # Collect .deb packages
          cp -v build/compose/binaries/main-release/deb/*.deb artifacts/ 2>/dev/null || true
          # Collect .rpm packages
          cp -v build/compose/binaries/main-release/rpm/*.rpm artifacts/ 2>/dev/null || true
          # Collect portable tar.gz packages
          cp -v build/distributions/*.tar.gz artifacts/ 2>/dev/null || true

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MuzikPlayer-${{ matrix.arch }}
          path: src/artifacts/*

  release:
    name: "Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Flatten artifacts directory
        run: |
          mkdir -p dist
          find release-artifacts -type f -exec cp -v {} dist/ \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
